name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests (offline, includes demo parity checks)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
      - name: Build static demo
        run: npm run build:demo
      - name: Demo makes no third-party requests
        run: |
          if grep -rEo 'https?://[^"'"'"' )]+' dist-demo | grep -vE 'w3\.org|reactjs\.org|react\.dev|localhost'; then
            echo "Found external URLs in the demo build" && exit 1
          fi
